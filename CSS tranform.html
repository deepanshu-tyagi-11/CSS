                            <!-- [ROTATE] -->
                             <!-- .) rotate an element around a fix point.
                             .) DEFINE USING THE ROTATE() FUNCTION WITHIN THE TRANSFORM PROPERTY.  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>css tranform</title>
    <style>
    #transform{
        height: 80px;
        width: 80px;
        background-color: darkcyan;
        border: 2px solid red;
        position: relative;
        border-radius: 20px;
        text-align: center;
       /* transform: rotate(45deg); */
         top:100px;
        left:200px;
    }
    #transform:hover{
        /* transform: rotate(270deg); */
        background-color: yellow;
        transition: all 3s ease-in;
        transform: rotatex(270deg);
        /* transform: rotatey(270deg); *//* x or y lagan se hum box ko 3D mai bhe move kr sakta hai*/
    }
    </style>
</head>
<body>
    <div id = "transform"> box</div>
</body>
</html>
