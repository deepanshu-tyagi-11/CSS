<!-- 1.) there are two states to use transition .1st initial state & 2nd final state.
 2.) css transition is a property  that enable SMOOTH animation between chnage in CSS property value-->
<!-- .) transition property= Define will css property will transition.
.)transition duration= set hiw lon the transition lasts.
.)transition timing function = control the speed curve of the transition.
.)transition delay =specifies the delay before the transition stsrts. 

[NOTE] = mdn reference pa ja kr aur jon se bhe hama apna hisab se property change kkrni ho kr sakta hai using [TRANSITION] -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>pseudo class</title>
    <style>
        #pseudo-class{
            height: 20px;
            width: 100px;
            background-color: aquamarine;
            border: 2px salmon;
            border-radius: 5px;
            /* transition-duration:  3s;/*mtlb 3 second ka andar chmage hoga
            transition-delay:         2s;delay mtlb 2 second bad change hoga
            transition-timing-function:   ease-in-out;
           transition-property: all; /all ka mtlb hai ke jitni bhe property hum chnage kr rahya ha vo transition ke madad se kr dega/
           transition: all 3s ease-in-out 3s ;/* hum asha bhot sari property ko ek sath bhe define kr sakta hai*/

        }
        #pseudo-class:hover{/* hover use krta ha jub hum ksi cheej pa apna cursor la jata ha to iski property change ho jati hai*/
            background-color: rgb(227, 94, 156);
            height: 30px;
            width: 50px;
        }
        #pseudo-class:active{/*active hum jub use krta hai jub hum ksi cheej pa clic krta hai*/
            background-color: rgb(51, 166, 68);

        }
    </style>
</head>
<body>
<div id="pseudo-class"> CLICK</div>
    
</body>
</html>
